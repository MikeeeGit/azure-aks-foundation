name: Terraform CI
"on":
  pull_request: {}
  push:
    branches: [main, develop]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform root
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests
  config-uks-dev:
    name: Example uks/dev
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/targets
      var-files: |
        config/global.tfvars
        config/uks/dev/dev.tfvars
  config-uks-pprd:
    name: Example uks/pprd
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/targets
      var-files: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
  config-uks-prd:
    name: Example uks/prd
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/targets
      var-files: |
        config/global.tfvars
        config/uks/prd/prd.tfvars
  config-ukw-bcdr:
    name: Example ukw/bcdr
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/targets
      var-files: |
        config/global.tfvars
        config/ukw/bcdr/bcdr.tfvars
  example-1:
    name: Cluster module
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: modules/cluster
      test-directory: tests
  ingress-tls:
    name: Ingress TLS workload identity
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/ingress-tls
      var-files: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/ingress-tls/workload.tfvars

  disposable-lab:
    name: Disposable dual-AKS lab
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@281d779aced9c6e7da082b5e57c85639dc1858df
    with:
      template-ref: 281d779aced9c6e7da082b5e57c85639dc1858df
      directory: .
      test-directory: tests/disposable-lab
      var-files: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/disposable-lab/clusters.tfvars
