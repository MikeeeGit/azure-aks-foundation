# Azure Repos PR checks are enforced by build-validation policies.
trigger:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
pr:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
resources:
  repositories:
    - repository: deliveryTemplates
      type: git
      name: terraform-delivery-templates
      ref: 281d779aced9c6e7da082b5e57c85639dc1858df
jobs:
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: TerraformRoot
      directory: .
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_dev
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/dev/dev.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_pprd
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_prd
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/prd/prd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_ukw_bcdr
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/ukw/bcdr/bcdr.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_1
      directory: modules/cluster
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: IngressTlsWorkload
      directory: .
      testDirectory: tests/ingress-tls
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/ingress-tls/workload.tfvars

  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: DisposableDualAksLab
      directory: .
      testDirectory: tests/disposable-lab
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/disposable-lab/clusters.tfvars
