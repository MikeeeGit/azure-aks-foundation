# Explicit compatibility profile. Replace clientID/tenantId from the applied handoff.
# The corresponding Key Vault certificate must have an exportable private key.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-demo-tls
  namespace: platform-demo
spec:
  provider: azure
  secretObjects:
    - secretName: platform-demo-tls
      type: kubernetes.io/tls
      data:
        - objectName: platform-demo-ingress
          key: tls.key
        - objectName: platform-demo-ingress
          key: tls.crt
  parameters:
    usePodIdentity: "false"
    clientID: EXAMPLE_APPLIED_WORKLOAD_CLIENT_ID
    tenantId: EXAMPLE_APPLIED_TENANT_ID
    keyvaultName: example-platform-app
    objects: |
      array:
        - |
          objectName: platform-demo-ingress
          objectType: secret
          objectFormat: pem
          objectVersion: ""
